[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/geeooff/exchange-catastrophic-migration"
authors = ["Geoffrey Vancoetsem"]
publish = false

[workspace.dependencies]
ecm-audit = { path = "crates/ecm-audit" }
ecm-ews = { path = "crates/ecm-ews" }
ecm-graph = { path = "crates/ecm-graph" }
ecm-http = { path = "crates/ecm-http" }
ecm-model = { path = "crates/ecm-model" }
ecm-pst = { path = "crates/ecm-pst" }
ecm-store = { path = "crates/ecm-store" }

base64 = "0.23"
clap = { version = "4.5", features = ["derive"] }
compressed-rtf = "1"
encoding_rs = "0.8"
outlook-pst = "1.2"
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
windows = "0.62"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
